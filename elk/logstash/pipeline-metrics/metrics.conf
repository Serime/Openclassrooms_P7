input {
  http_poller {
    urls => {
      runs => {
        method => get
        url => "https://api.github.com/repos/Serime/Openclassrooms_P7/actions/runs?per_page=100"
        headers => {
          "Accept" => "application/vnd.github+json"
          "User-Agent" => "orion-crm-elk"
        }
      }
    }
    schedule => { cron => "*/5 * * * *" }
    codec => "json"
    tags => ["github_runs"]
  }

  http_poller {
    urls => {
      deployments => {
        method => get
        url => "https://api.github.com/repos/Serime/Openclassrooms_P7/deployments?environment=production&per_page=100"
        headers => {
          "Accept" => "application/vnd.github+json"
          "User-Agent" => "orion-crm-elk"
        }
      }
    }
    schedule => { cron => "*/5 * * * *" }
    codec => "json"
    tags => ["github_deployments"]
  }

  http_poller {
    urls => {
      sonar => "https://sonarcloud.io/api/measures/component?component=Serime_Openclassrooms_P7&metricKeys=coverage,vulnerabilities,bugs,code_smells,security_rating,reliability_rating,sqale_index,ncloc,duplicated_lines_density"
    }
    schedule => { cron => "*/30 * * * *" }
    codec => "json"
    tags => ["sonar"]
  }
}

filter {
  if "github_runs" in [tags] {
    split {
      field => "[workflow_runs]"
    }
    if [workflow_runs][status] != "completed" {
      drop {}
    }
    ruby {
      code => "
        require 'time'
        run = event.get('workflow_runs')
        started = Time.parse(run['run_started_at'])
        finished = Time.parse(run['updated_at'])
        branch = run['head_branch'].to_s
        delivery = run['name'] == 'CI' && run['event'] == 'push' && run['conclusion'] == 'success' &&
                   (branch == 'main' || branch.start_with?('v'))
        event.set('@timestamp', LogStash::Timestamp.new(started))
        event.set('[run][id]', run['id'].to_s)
        event.set('[run][workflow]', run['name'])
        event.set('[run][trigger]', run['event'])
        event.set('[run][branch]', branch)
        event.set('[run][sha]', run['head_sha'].to_s[0, 7])
        event.set('[run][conclusion]', run['conclusion'])
        event.set('[run][attempt]', run['run_attempt'])
        event.set('[run][dependabot]', branch.start_with?('dependabot/'))
        event.set('[run][duration_s]', (finished - started).round)
        event.set('[run][delivery]', delivery)
        commit = run['head_commit']
        if delivery && commit && commit['timestamp']
          event.set('[run][lead_time_min]', ((finished - Time.parse(commit['timestamp'])) / 60.0).round(2))
        end
      "
    }
    mutate {
      remove_field => ["workflow_runs", "total_count", "event", "@version"]
    }
  } else if "github_deployments" in [tags] {
    ruby {
      code => "
        require 'time'
        event.set('@timestamp', LogStash::Timestamp.new(Time.parse(event.get('created_at'))))
        event.set('[deployment][id]', event.get('id').to_s)
        event.set('[deployment][sha]', event.get('sha').to_s[0, 7])
        event.set('[deployment][ref]', event.get('ref'))
        event.set('[deployment][environment]', event.get('environment'))
        event.to_hash.keys.each { |key| event.remove(key) unless ['@timestamp', 'deployment', 'tags'].include?(key) }
      "
    }
  } else if "sonar" in [tags] {
    ruby {
      code => "
        event.get('[component][measures]').to_a.each do |measure|
          event.set('[quality][' + measure['metric'] + ']', measure['value'].to_f)
        end
        event.remove('component')
        event.remove('@version')
        event.remove('event')
      "
    }
  }
}

output {
  if "github_runs" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "orion-pipeline-runs"
      document_id => "%{[run][id]}"
      manage_template => true
      template => "/usr/share/logstash/templates/orion-metrics.json"
      template_name => "orion-metrics"
      template_api => "composable"
      template_overwrite => true
    }
  } else if "github_deployments" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "orion-pipeline-deployments"
      document_id => "%{[deployment][id]}"
      manage_template => false
    }
  } else if "sonar" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "orion-quality-%{+YYYY.MM}"
      manage_template => false
    }
  }
}
