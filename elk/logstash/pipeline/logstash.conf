input {
  beats {
    port => 5044
  }
}

filter {
  mutate {
    add_field => { "service" => "%{[docker][container][labels][com_docker_compose_service]}" }
  }

  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }
  }

  if [service] == "server" and [parsed] {
    date {
      match => ["[parsed][timestamp]", "ISO8601"]
    }
    mutate {
      rename => {
        "[parsed][level]" => "[log][level]"
        "[parsed][message]" => "[event][action]"
        "[parsed][http]" => "http"
        "[parsed][client]" => "browser"
        "[parsed][error]" => "app_error"
        "[parsed][origin]" => "origin"
      }
    }
  } else if [service] == "client" and [parsed] {
    date {
      match => ["[parsed][time]", "ISO8601"]
    }
    mutate {
      rename => {
        "[parsed][method]" => "[http][method]"
        "[parsed][uri]" => "[http][path]"
        "[parsed][status]" => "[http][status_code]"
        "[parsed][body_bytes_sent]" => "[http][response_bytes]"
        "[parsed][http_user_agent]" => "[http][user_agent]"
      }
      add_field => { "[event][action]" => "nginx_access" }
    }
    ruby {
      code => "
        seconds = event.get('[parsed][request_time]').to_f
        event.set('[http][duration_ms]', (seconds * 1000).round(2))
        upstream = event.get('[parsed][upstream_response_time]').to_s
        event.set('[http][upstream_duration_ms]', (upstream.to_f * 1000).round(2)) if upstream =~ /^[0-9]/
        status = event.get('[http][status_code]').to_i
        level = status >= 500 ? 'error' : (status >= 400 ? 'warn' : 'info')
        event.set('[log][level]', level)
      "
    }
  } else if [service] == "client" {
    mutate {
      add_field => { "[event][action]" => "nginx_error" }
      gsub => ["message", "client: [^,]+", "client: -"]
    }
    if [message] =~ /\[(error|crit|alert|emerg)\]/ {
      mutate { add_field => { "[log][level]" => "error" } }
    } else if [message] =~ /\[warn\]/ {
      mutate { add_field => { "[log][level]" => "warn" } }
    } else {
      mutate { add_field => { "[log][level]" => "info" } }
    }
  }

  if [http][path] {
    mutate {
      gsub => ["[http][path]", "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", ":id"]
    }
  }

  mutate {
    remove_field => ["parsed", "agent", "ecs", "input", "host", "docker", "tags", "@version", "[event][original]"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "orion-logs-%{+YYYY.MM.dd}"
    data_stream => false
    manage_template => true
    template => "/usr/share/logstash/templates/orion-logs.json"
    template_name => "orion-logs"
    template_api => "composable"
    template_overwrite => true
  }
}
