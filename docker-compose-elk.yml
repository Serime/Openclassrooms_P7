name: orion-elk

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23@sha256:4d0724bb8d78d7a2330693623e26ca4d621079d062ecc8a30b3e1fc180ec14c1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    mem_limit: 2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - elk
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.23@sha256:a77c29e406ddc6311b302703889f0953b5620dd5aa2445b0cdbcf7f88e285766
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
      XPACK_MONITORING_ENABLED: "false"
    mem_limit: 1g
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./elk/logstash/templates:/usr/share/logstash/templates:ro
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.23@sha256:920b24f689833d34205f426f5359864378a572e829c53016073f0a6837c2e995
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_OPTIN: "false"
      I18N_LOCALE: fr-FR
    mem_limit: 1g
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 10s
      retries: 30

  kibana-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23@sha256:4d0724bb8d78d7a2330693623e26ca4d621079d062ecc8a30b3e1fc180ec14c1
    volumes:
      - ./elk/kibana:/setup:ro
    networks:
      - elk
    depends_on:
      kibana:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - sh
      - -c
      - >
        curl -fsS -X POST 'http://kibana:5601/api/saved_objects/_import?overwrite=true'
        -H 'kbn-xsrf: true' -F file=@/setup/orion-dashboard.ndjson
        && echo 'Tableau de bord importé'

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.19.23@sha256:2122adc42e6aa4b2fcb81d1c38725dbe27957d1b9d5cc058a18375c2eab62d52
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    mem_limit: 256m
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data
    networks:
      - elk
    depends_on:
      - logstash

volumes:
  es-data:
  filebeat-data:

networks:
  elk:
    driver: bridge
